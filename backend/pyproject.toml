[project]
name = "kavach-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.1",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.12",
    "limits>=5.8.0",
    "numpy>=2.4.6",
    "opencv-python-headless>=4.10",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rapidocr>=3.9.2",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn[standard]>=0.54.0",
    "zxing-cpp>=3.1.1",
]

[tool.uv]
# rapidocr requires opencv-python, whose cv2 needs libGL (absent on Render and slim Linux
# images). The headless build provides the same cv2 module without GUI libraries.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "qrcode[pil]>=8.2",
    "respx>=0.23.1",
    "ruff>=0.16.9",
    "scikit-learn>=1.9.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# DB tests round-trip to Supabase and are slow; run them with `-m db` (or everything: -m "").
# LLM tests call the real Groq API (uses quota); run them with `-m llm`.
addopts = '-m "not db and not llm"'
markers = [
    "db: touches the real database (Supabase); deselected by default",
    "llm: calls the real Groq API; deselected by default",
]
